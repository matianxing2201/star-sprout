# 星芽 StarSprout —— 云服务器部署编排（设计取舍见 docs/adr/0004）
#
# 两个容器分工：
#   web     nginx：对外开 80/443，托管构建产物 dist/
#   certbot Let's Encrypt 证书签发与每 6 小时的续期检查
#
# 证书续期链路：certbot 把新证书写进共享卷 certbot-conf →
# web 容器的循环每 6 小时给 nginx 发 HUP 信号 reload → 新证书生效。
# 不需要挂 docker.sock，也不需要宿主机 cron。
#
# 站点配置按阶段切换：项目根目录 .env 里的 NGINX_CONF
# 初始为 http.conf，签完证书后改成 ssl.conf 再 `docker compose up -d`。

services:
  web:
    build:
      context: .
    image: starsprout-web
    container_name: starsprout-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/${NGINX_CONF:-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "-c"]
    # 注意：command 必须用列表包一整块（字符串会被 compose 拆词），
    # 整个脚本作为 sh -c 的唯一参数传入。
    command:
      - |
        nginx -g 'daemon off;' &
        nginx_pid=$$!
        # docker stop 发的是 TERM，转发给 nginx 让它优雅退出
        trap 'kill -s TERM "$$nginx_pid"; exit 0' TERM
        while :; do
          sleep 6h &
          wait $$!
          # nginx 意外挂了就让容器退出，交给 restart 策略拉起
          kill -0 "$$nginx_pid" 2>/dev/null || exit 1
          # reload 让 certbot 续期后的新证书（及任何配置变更）生效
          kill -s HUP "$$nginx_pid"
        done

  certbot:
    image: certbot/certbot
    container_name: starsprout-certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit' TERM
        while :; do
          sleep 6h &
          wait $$!
          echo "[certbot] $$(date '+%F %T') 续期检查"
          # 续期条件默认「距到期 < 30 天」，没到点就什么也不做；
          # 真正续期时才写入 certbot-conf 卷。
          certbot renew --webroot -w /var/www/certbot
        done

volumes:
  certbot-www:
  certbot-conf:
