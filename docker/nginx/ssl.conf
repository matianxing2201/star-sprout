# 阶段二：HTTPS —— 80 只保留证书验证与跳转，站点走 443。
# 前提：/etc/letsencrypt/live/starsprout.tianxinglab.cloud/ 下已有证书，
# 否则 nginx 会因证书文件不存在而拒绝启动。

server {
    listen 80;
    listen [::]:80;
    server_name starsprout.tianxinglab.cloud;

    # 续期验证仍走 HTTP，certbot 每 6 小时检查一次续期。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余一律 301 到 https。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name starsprout.tianxinglab.cloud;

    ssl_certificate     /etc/letsencrypt/live/starsprout.tianxinglab.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starsprout.tianxinglab.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
