# 阶段一：HTTP —— 站点先跑起来，同时应答 Let's Encrypt 的签证书验证。
# 签完证书后把 .env 里的 NGINX_CONF 换成 ssl.conf 再 up -d（见部署手册）。

server {
    listen 80;
    listen [::]:80;
    server_name starsprout.tianxinglab.cloud;

    root /usr/share/nginx/html;
    index index.html;

    # certbot 把「所有权证明」写到这个卷里，Let's Encrypt 会来这个路径抽查。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # index.html 永远重新验证，保证发新版后浏览器立刻拿到新入口。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 给静态资源文件名带内容哈希（如 index-Bx3k9s.js），
    # 内容变则文件名变，可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退：路径没命中真实文件时回落到 index.html，
    # 由 vue-router 在前端解析路由（等价于 GitHub Pages 的 404.html 技巧）。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
